<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Editar Habitación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .imagen-preview{
            width:250px;
            height:180px;
            object-fit:cover;
            border-radius:10px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow p-4">

                <h2 class="text-primary mb-4 text-center">

                    ✏ Editar Habitación

                </h2>

                <form th:action="@{/habitaciones/actualizar}"
                      th:object="${habitacion}"
                      method="post"
                      enctype="multipart/form-data">

                    <input type="hidden"
                           th:field="*{id}">

            
                    <input type="hidden"
                           th:field="*{imagen}">

                    <div class="mb-3">

                        <label class="form-label">

                            Nombre

                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Precio

                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{precio}"
                               required>

                    </div>

                    <!-- ESTADO -->
                    <div class="mb-3">

                        <label class="form-label">

                            Estado

                        </label>

                        <select class="form-select"
                                th:field="*{disponible}">

                            <option th:value="true">

                                Disponible

                            </option>

                            <option th:value="false">

                                Ocupada

                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Imagen Actual

                        </label>

                        <br>

                        <img th:if="${habitacion.imagen != null}"
                             th:src="@{'/uploads/' + ${habitacion.imagen}}"
                             class="imagen-preview shadow">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Cambiar Imagen

                        </label>

                        <input type="file"
                               name="archivoImagen"
                               class="form-control">

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-success">

                            💾 Guardar Cambios

                        </button>

                        <a th:href="@{/habitaciones}"
                           class="btn btn-secondary">

                            ⬅ Volver

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Nueva Habitación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background-color:#f4f6f9;
        }

        .card{
            border:none;
            border-radius:15px;
        }

    </style>

</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow p-4">

                <h2 class="text-primary mb-4 text-center">

                    🏨 Nueva Habitación

                </h2>

                <form th:action="@{/habitaciones/guardar}"
                      th:object="${habitacion}"
                      method="post"
                      enctype="multipart/form-data">

                    <div class="mb-3">

                        <label class="form-label">

                            Nombre

                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Precio

                        </label>

                        <input type="number"
                               class="form-control"
                               th:field="*{precio}"
                               required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Disponible

                        </label>

                        <select class="form-select"
                                th:field="*{disponible}">

                            <option th:value="true">

                                Sí

                            </option>

                            <option th:value="false">

                                No

                            </option>

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Imagen

                        </label>

                        <input type="file"
                               name="archivoImagen"
                               class="form-control">

                    </div>

                    <div class="d-flex gap-2">

                        <button type="submit"
                                class="btn btn-success">

                            💾 Guardar

                        </button>

                        <a th:href="@{/habitaciones}"
                           class="btn btn-secondary">

                            ⬅ Volver

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Formulario Reserva</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .card-form {
            max-width: 600px;
            margin: 50px auto;
            padding: 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .titulo {
            text-align: center;
            color: #0d6efd;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .is-invalid {
            border-color: #dc3545;
        }

    </style>
</head>

<body>

<div class="container">

    <h1 class="titulo">🏨 Registro de Reserva 🏨</h1>

    <div th:if="${mensajeError}"
         class="alert alert-danger">

        <span th:text="${mensajeError}"></span>

    </div>

    <div class="card-form">

        <form th:action="@{/reservas/guardar}"
              th:object="${reserva}"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{imagen}">

            <div class="mb-3">

                <label class="form-label">Nombre Cliente</label>

                <input type="text"
                       th:field="*{nombreCliente}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('nombreCliente')} ? 'is-invalid' : ''">

                <div class="text-danger"
                     th:if="${#fields.hasErrors('nombreCliente')}"
                     th:errors="*{nombreCliente}">
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Habitación</label>

                <input type="text"
                       th:field="*{habitacion}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('habitacion')} ? 'is-invalid' : ''">

                <div class="text-danger"
                     th:if="${#fields.hasErrors('habitacion')}"
                     th:errors="*{habitacion}">
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Fecha Entrada</label>

                <input type="date"
                       th:field="*{fechaEntrada}"
                       class="form-control"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">Fecha Salida</label>

                <input type="date"
                       th:field="*{fechaSalida}"
                       class="form-control"
                       required>

            </div>

            <div class="form-check mb-3">

                <input type="checkbox"
                       th:field="*{confirmada}"
                       class="form-check-input">

                <label class="form-check-label">
                    Reserva Confirmada
                </label>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Imagen Habitación
                </label>

                <div th:if="${reserva.imagen != null and !reserva.imagen.isBlank()}"
                     class="mb-2">

                    <img th:src="@{'/uploads/' + ${reserva.imagen}}"
                         style="height:120px;
                                border-radius:10px;
                                border:1px solid #dee2e6;
                                padding:4px;">

                </div>

                <input type="file"
                       name="archivoImagen"
                       class="form-control"
                       accept="image/*">

                <div class="form-text">
                    Deja vacío para conservar la imagen actual.
                </div>

            </div>

            <div class="d-flex justify-content-between">

                <a th:href="@{/reservas}"
                   class="btn btn-secondary">

                    ⬅ Volver

                </a>

                <button type="submit"
                        class="btn btn-success">

                    Guardar Reserva

                </button>

            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>

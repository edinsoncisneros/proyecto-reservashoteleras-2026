<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #f4f6f9;
        }

        .card-registro {
            max-width: 500px;
            margin: 60px auto;
            padding: 25px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card-registro">

        <!-- Título -->
        <h2 class="text-center text-primary mb-4">
            Registro Usuario
        </h2>

        <!-- Mensaje error -->
        <div th:if="${error}"
             class="alert alert-danger">

            <span th:text="${error}"></span>

        </div>

        <!-- Formulario -->
        <form th:action="@{/registro}"
              th:object="${usuario}"
              method="post">

            <!-- Nombre -->
            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input type="text"
                       th:field="*{nombre}"
                       class="form-control">

                <div class="text-danger"
                     th:errors="*{nombre}">
                </div>

            </div>

            <!-- Correo -->
            <div class="mb-3">

                <label class="form-label">
                    Correo
                </label>

                <input type="email"
                       th:field="*{correo}"
                       class="form-control">

                <div class="text-danger"
                     th:errors="*{correo}">
                </div>

            </div>

            <!-- Password -->
            <div class="mb-3">

                <label class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       th:field="*{password}"
                       class="form-control">

                <div class="text-danger"
                     th:errors="*{password}">
                </div>

            </div>

            <!-- Botón -->
            <button type="submit"
                    class="btn btn-success w-100">

                Registrarse

            </button>

        </form>

        <div class="text-center mt-3">

            <a th:href="@{/login}">
                ¿Ya tienes cuenta? Inicia sesión
            </a>

        </div>

    </div>

</div>

</body>
</html>
